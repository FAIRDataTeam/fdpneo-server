# Full-stack FDP deployment — one command brings up the client, the server, and
# the backing services (GraphDB, Postgres, Keycloak) with the GraphDB repository
# and database schema bootstrapped automatically.
#
#   cp .env.example .env      # then edit PUBLIC_HOST / secrets
#   docker compose -f deploy/stack/compose.yaml --env-file deploy/stack/.env up -d
#
# Browser-facing: client (CLIENT_PORT), server API (SERVER_PORT), Keycloak
# (KEYCLOAK_PORT). GraphDB + Postgres stay on the internal network. The client
# image is configured at runtime to call the API at PUBLIC_HOST:SERVER_PORT; the
# server's CORS allows PUBLIC_HOST:CLIENT_PORT.
#
# ⚠ The bundled Keycloak realm + credentials (admin/admin, fdp-server-dev-secret,
#   start-dev mode) are DEVELOPMENT-ONLY. Rotate every secret and harden Keycloak
#   (TLS, production mode) before any real deployment — see README.md.

name: fdpneo


services:
  # --- backing services ----------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdp}
      POSTGRES_DB: ${POSTGRES_DB:-fdp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdp} -d ${POSTGRES_DB:-fdp}"]
      interval: 5s
      timeout: 3s
      retries: 12

  graphdb:
    image: ontotext/graphdb:10.7.0
    restart: unless-stopped
    environment:
      GDB_JAVA_OPTS: >-
        -Xmx2g -Xms1g
        -Dgraphdb.workbench.cors.enable=true
    volumes:
      - graphdb-data:/opt/graphdb/home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7200/rest/repositories"]
      interval: 10s
      timeout: 5s
      retries: 18

  # Oneshot: create the `fdp` GraphDB repository if it does not exist yet.
  # Idempotent — checks /repositories/fdp/size first, only POSTs the config when
  # the repo is missing. Exits 0 either way so the server can start.
  graphdb-init:
    image: curlimages/curl:8.10.1
    depends_on:
      graphdb:
        condition: service_healthy
    volumes:
      - ../graphdb/fdp-repo-config.ttl:/config/fdp-repo-config.ttl:ro
    entrypoint:
      - sh
      - -c
      - |
        if curl -fsS "http://graphdb:7200/repositories/fdp/size" >/dev/null 2>&1; then
          echo "[graphdb-init] repository 'fdp' already exists — nothing to do."
        else
          echo "[graphdb-init] creating repository 'fdp'..."
          curl -fsS -X POST "http://graphdb:7200/rest/repositories" \
            -F "config=@/config/fdp-repo-config.ttl" \
            && echo "[graphdb-init] repository 'fdp' created."
        fi
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Lenient hostname (start-dev) → the token issuer follows the request URL,
      # so browser and server agree as long as both use PUBLIC_HOST:KEYCLOAK_PORT.
    volumes:
      - ../keycloak/realm-fdp-dev.json:/opt/keycloak/data/import/realm-fdp-dev.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 18

  # --- application tier -----------------------------------------------------
  server:
    image: ghcr.io/fairdatateam/fdpneo-server:${IMAGE_TAG:-main}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      graphdb-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    # Make PUBLIC_HOST resolve to the docker host so the server can reach the
    # Keycloak issuer URL (PUBLIC_HOST:KEYCLOAK_PORT) the browser also uses.
    extra_hosts:
      - "${PUBLIC_HOST:-localhost}:host-gateway"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Serve the interactive API docs (Swagger /fdp-api/docs, ReDoc /fdp-api/redoc)
      # even though ENVIRONMENT is production — this is an evaluation stack. The
      # OpenAPI spec at /fdp-api/openapi.json is always served regardless.
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
      BASE_URL: http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8000}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-fdp}:${POSTGRES_PASSWORD:-fdp}@postgres:5432/${POSTGRES_DB:-fdp}
      FDP_TRIPLESTORE_QUERY_ENDPOINT: http://graphdb:7200/repositories/fdp
      FDP_TRIPLESTORE_UPDATE_ENDPOINT: http://graphdb:7200/repositories/fdp/statements
      FDP_TRIPLESTORE_GRAPH_STORE_ENDPOINT: http://graphdb:7200/repositories/fdp/rdf-graphs/service
      FDP_OIDC_ISSUER: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8081}/realms/fdp-dev
      FDP_OIDC_AUDIENCE: ${FDP_OIDC_AUDIENCE:-fdp}
      # Containerized client (CLIENT_PORT, default 5173 — the origin the bundled
      # Keycloak realm allows for OIDC redirects) plus the 127.0.0.1 Vite dev
      # origin, so `npm run dev` can also hit this stack's API without a CORS reject.
      FDP_CORS_ALLOW_ORIGINS: http://${PUBLIC_HOST:-localhost}:${CLIENT_PORT:-5173},http://127.0.0.1:5173
      FDP_CORS_ALLOW_CREDENTIALS: "true"
      # Enable the /fdp-api/users IdP-admin facade (confidential service account).
      FDP_IDP_ADMIN_CLIENT_ID: ${FDP_IDP_ADMIN_CLIENT_ID:-fdp-server}
      FDP_IDP_ADMIN_CLIENT_SECRET: ${FDP_IDP_ADMIN_CLIENT_SECRET:-fdp-server-dev-secret}
      FDP_IDP_ADMIN_BASE_URL: http://keycloak:8080
      FDP_PROFILE_AUTO_APPLY: "true"
      # External (remote) label resolution (Phase 21 / ADR-0012 extension): let
      # GET /labels dereference external IRIs (DOI/ORCID/SKOS) to human labels.
      # Allow-listed + SSRF-guarded; the list includes the terminal RDF hosts
      # redirect-based content negotiation lands on (CrossRef/DataCite/ORCID).
      # ROR is JSON-only and not resolved by the generic RDF path.
      FDP_REMOTE_LABELS_ENABLED: ${FDP_REMOTE_LABELS_ENABLED:-true}
      FDP_REMOTE_LABELS_ALLOWED_HOSTS: ${FDP_REMOTE_LABELS_ALLOWED_HOSTS:-doi.org,api.crossref.org,data.crossref.org,data.datacite.org,orcid.org,pub.orcid.org}
    ports:
      - "${SERVER_PORT:-8000}:8000"

  client:
    image: ghcr.io/fairdatateam/fdpneo-client:${IMAGE_TAG:-main}
    build:
      context: ../../../client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    environment:
      # Injected into /config.js at container start (see client entrypoint).
      FDP_API_URL: http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8000}
      FDP_PUBLIC_ORIGIN: http://${PUBLIC_HOST:-localhost}:${CLIENT_PORT:-5173}
    ports:
      - "${CLIENT_PORT:-5173}:80"

  # MCP bridge (ADR-0018): a read-only Model Context Protocol sidecar so coding
  # agents can consume this FDP. It uses ONLY the public FDP surface. Streamable-
  # HTTP transport; the MCP endpoint is at http://PUBLIC_HOST:MCP_PORT/mcp,
  # liveness at /healthz.
  #
  # OPT-IN via the `mcp` profile — the fdp-mcp image is not public (yet), so a
  # default `up` skips this service rather than failing the pull for anyone
  # without GHCR access. Enable with `--profile mcp` on the `up` command (or
  # COMPOSE_PROFILES=mcp); building from source additionally needs the private
  # `mcp` repo checked out as a sibling.
  mcp:
    profiles: ["mcp"]
    image: ghcr.io/fairdatateam/fdp-mcp:${IMAGE_TAG:-main}
    build:
      context: ../../../mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    # Resolve PUBLIC_HOST to the docker host so the bridge reaches the server at
    # the SAME origin the FDP mints its record IRIs under — the bridge pins its
    # egress to FDP_BASE_URL's origin (ADR-0018 §3), so this must match. Mirrors
    # the server↔Keycloak host-gateway wiring above.
    extra_hosts:
      - "${PUBLIC_HOST:-localhost}:host-gateway"
    environment:
      FDP_BASE_URL: http://${PUBLIC_HOST:-localhost}:${SERVER_PORT:-8000}
      FDP_MCP_TRANSPORT: streamable-http
      FDP_MCP_HOST: 0.0.0.0
      FDP_MCP_PORT: 8000
    ports:
      - "${MCP_PORT:-8002}:8000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  graphdb-data:
