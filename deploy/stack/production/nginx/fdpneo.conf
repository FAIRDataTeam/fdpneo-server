# nginx edge for the single-domain production stack — the drop-in alternative
# to the bundled Caddyfile, for hosts that already run nginx.
#
# Same routing contract, one HTTPS origin:
#
#   /              browsers (Accept: text/html) → client (SPA)
#                  RDF content negotiation      → server (record IRIs)
#   /fdp-api/…     server (API, OpenAPI, SPARQL)
#   /auth/…        Keycloak
#   /mcp           MCP bridge (optional --profile mcp)
#
# This is the same Accept-header split the FDP *reference implementation*'s
# client image performs internally (verified against fairdata/
# fairdatapoint-client: default → server; text/html and static assets →
# client; Swagger paths forced to the server) — here it lives at the edge so
# the stock fdpneo images stay unchanged.
#
# Pairs with compose.nginx.yaml, which publishes the app containers on
# LOOPBACK ports for this host-level nginx to reach:
#
#   client   127.0.0.1:8090
#   server   127.0.0.1:8091
#   keycloak 127.0.0.1:8092
#   mcp      127.0.0.1:8093   (only with --profile mcp)
#
# Install: fill in your domain + certificate paths, place this file in
# /etc/nginx/sites-available/ (symlink into sites-enabled/) or conf.d/,
# then `nginx -t && systemctl reload nginx`. See the README walkthrough.

# The content-negotiation split: text/html anywhere in Accept → the SPA;
# everything else (text/turtle, application/ld+json, */*, no header) → the
# server, so record IRIs dereference to RDF for machine clients.
map $http_accept $fdp_upstream {
    default      http://127.0.0.1:8091;  # server (RDF / API clients)
    "~text/html" http://127.0.0.1:8090;  # client (browsers)
}

# HTTP → HTTPS redirect (and the ACME webroot for certbot renewals).
server {
    listen 80;
    listen [::]:80;
    server_name fdp.example.org;  # ← your PUBLIC_HOST

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fdp.example.org;  # ← your PUBLIC_HOST

    # --- TLS (e.g. certbot: certbot certonly --webroot -w /var/www/certbot -d fdp.example.org)
    ssl_certificate     /etc/letsencrypt/live/fdp.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fdp.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- security headers (edge enforcement)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # No X-Frame-Options here: Keycloak and the client manage their own frame
    # policy — the OIDC session iframe must keep working.
    server_tokens off;

    # Request body cap (records + SHACL uploads fit comfortably).
    client_max_body_size 20m;

    # ⚠ Do NOT enable `gzip on` for the proxied locations: on-the-fly
    # compression alters the ETag (nginx weakens it to W/…; other proxies
    # append -gzip/-zstd), and the FDP round-trips ETags via If-Match for
    # optimistic concurrency — altered ETags break every edit. If you want
    # compression, scope it to /assets/ only (content-hashed, never edited).

    # Forwarded headers: Keycloak (KC_PROXY_HEADERS=xforwarded) and the
    # server's rate limiter (FDP_RATELIMIT_TRUST_FORWARDED_FOR) rely on these.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # --- the API: everything the server namespaces under /fdp-api
    location /fdp-api/ {
        proxy_pass http://127.0.0.1:8091;
    }

    # --- SPA OIDC callback: <origin>/auth/callback is a CLIENT route, not a
    # Keycloak path — the exact match must win over the /auth/ prefix below,
    # or login never completes.
    location = /auth/callback {
        proxy_pass http://127.0.0.1:8090;
    }

    # --- Keycloak under /auth (KC_HTTP_RELATIVE_PATH)
    location /auth/ {
        proxy_pass http://127.0.0.1:8092;
        proxy_buffer_size   16k;   # Keycloak's headers/cookies run large
        proxy_buffers       8 16k;
    }

    # --- MCP bridge (only with `--profile mcp`; 502 on this path otherwise)
    location /mcp {
        proxy_pass http://127.0.0.1:8093;
        proxy_http_version 1.1;    # streamable-HTTP: long-lived responses
        proxy_read_timeout 3600s;
        proxy_buffering    off;
    }

    # --- SPA static files (always the client, regardless of Accept)
    location /assets/   { proxy_pass http://127.0.0.1:8090; }
    location = /config.js  { proxy_pass http://127.0.0.1:8090; }
    location = /robots.txt { proxy_pass http://127.0.0.1:8090; }
    location ~ ^/favicon   { proxy_pass http://127.0.0.1:8090; }

    # --- the shared IRI space: conneg split (see the map above)
    location / {
        proxy_pass $fdp_upstream;
    }
}
