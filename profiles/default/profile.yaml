# Default deployment profile for FDP v2.
#
# This profile ships with the FDP server and bootstraps a standard
# DCAT-based metadata repository: Repository → Catalogs → Datasets /
# Data Services → Distributions. Communities that need custom schemas
# (e.g., an Ontology type) should either extend this profile or
# replace it entirely — see architecture §12 for the profile
# mechanism and bootstrap behaviour.
#
# `resourceDefinitions[]` is the source of truth for both the runtime
# Container Registry and the OpenAPI generator: declaring a type here
# lights up `/{urlPrefix}` and `/{urlPrefix}/{id}` (plus /spec,
# /expanded, /page/{childPrefix}) in the served API. Adding an
# Ontology type means adding one entry below.

apiVersion: fdp/v1
kind: DeploymentProfile

metadata:
  name: default
  version: 0.1.0
  description: Standard FDP profile based on DCAT 3 with FDP extensions.
  authors:
    - name: FDP Contributors
  homepage: https://specs.fairdatapoint.org

# Profile this one extends. Null for a base profile (this one).
extends: null

# SHACL schemas the FDP will register on bootstrap. Order matters when
# schemas reference each other; declare leaves first.
schemas:
  - id: fdp:Repository
    path: schemas/repository.ttl
  - id: dcat:Catalog
    path: schemas/catalog.ttl
  - id: dcat:Dataset
    path: schemas/dataset.ttl
  - id: dcat:DataService
    path: schemas/data-service.ttl
  - id: dcat:Distribution
    path: schemas/distribution.ttl

# Meta-metadata schema for record provenance. The FDP-managed fields.
metaMetadataSchema:
  path: schemas/meta-metadata.ttl

# ODRL Offer templates. The system-default Offer is referenced by the
# Repository's dct:rights so unscoped records inherit it.
offers:
  - id: system-default
    path: offers/public-read-steward-modify.ttl
    isSystemDefault: true

# Metadata types exposed by this deployment. Exactly one entry must
# declare urlPrefix: "" — that's the Repository at the API root.
# `children[]` declares the typed links the OpenAPI generator turns
# into per-type listing endpoints (`/.../page/<target>`).
resourceDefinitions:
  - urlPrefix: ""
    name: Repository
    schema: fdp:Repository
    children:
      - relationUri: dcat:catalog
        target: catalog
        title: Catalogs

  - urlPrefix: catalog
    name: Catalog
    schema: dcat:Catalog
    children:
      - relationUri: dcat:dataset
        target: dataset
        title: Datasets
      - relationUri: dcat:service
        target: data-service
        title: Data Services

  - urlPrefix: dataset
    name: Dataset
    schema: dcat:Dataset
    children:
      - relationUri: dcat:distribution
        target: distribution
        title: Distributions

  - urlPrefix: data-service
    name: DataService
    schema: dcat:DataService

  - urlPrefix: distribution
    name: Distribution
    schema: dcat:Distribution

# Seed records. Empty in the default profile; the root Repository
# itself is seeded automatically from the root resource definition.
seedRecords: []
