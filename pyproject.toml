[project]
name = "fdpneo"
version = "0.12.0"
description = "FAIR Data Point v2 server — a FAIR-aligned metadata repository implementing the FDP specifications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "FDP Contributors" },
]
keywords = ["fair", "fdp", "metadata", "rdf", "dcat", "shacl", "ldp", "sparql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  # HTTP / API
  "fastapi[standard]>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.14.2",  # floor clears GHSA-4xgf-cpjx-pc3j (pip-audit gate)
  "uvicorn[standard]>=0.30",
  # Transitive via fastapi; floors clear advisories until fastapi itself requires
  # safe versions (pip-audit gate):
  #   starlette        1.3.1  — CVE-2026-54282, CVE-2026-54283
  #   python-multipart 0.0.31 — CVE-2026-53538, CVE-2026-53539, CVE-2026-53540
  "starlette>=1.3.1",
  "python-multipart>=0.0.31",

  # RDF
  # Keep rdflib >= 7: it neutralizes RDF/XML external-entity (XXE) expansion that
  # earlier versions allowed on untrusted parse input (security audit R-01/R-02).
  "rdflib>=7.0",
  "pyshacl>=0.26",

  # Identity / OIDC
  "authlib>=1.3",
  # Transitive via authlib; floor clears CVE-2026-48990 (fixed 1.6.7) and
  # CVE-2026-49852 (fixed 1.6.8) in the JOSE layer. Keep until authlib requires
  # it (pip-audit gate).
  "joserfc>=1.6.8",
  # JWT validation library on the auth path — keep >= 2.13.0, which fixes
  # PYSEC-2026-175/177/178/179 (token-validation issues in earlier 2.x).
  "pyjwt[crypto]>=2.13.0",
  # Transitive via authlib / pyjwt[crypto]; floor clears GHSA-537c-gmf6-5ccf
  # (fixed in cryptography 48.0.1). Keep until a parent requires it (pip-audit gate).
  "cryptography>=48.0.1",
  "httpx>=0.27",

  # Storage
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",

  # Observability
  "structlog>=24.2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",

  # Geo lookup for anonymized metrics
  "geoip2>=4.8",
  # Transitive via geoip2; pinned to a floor that clears CVE-2026-34993 and
  # CVE-2026-47265 (fixed in aiohttp 3.14.0). Keep until geoip2 itself
  # requires a safe aiohttp (security-scan / pip-audit gate).
  "aiohttp>=3.14.0",

  # CLI
  "typer>=0.12",
  "rich>=13.7",

  # Deployment profile bundles (profile.yaml)
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "testcontainers[postgres]>=4.8",
  "httpx>=0.27",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "respx>=0.21",  # httpx mocking for OIDC tests
  "aiosqlite>=0.20",  # in-memory async DB for unit tests that exercise SQL
]

[project.scripts]
fdp = "fdpneo_server.cli:app"

[project.urls]
Homepage = "https://github.com/FAIRDataTeam/fdp-server"  # placeholder
Documentation = "https://specs.fairdatapoint.org"
Repository = "https://github.com/FAIRDataTeam/fdp-server"  # placeholder
Issues = "https://github.com/FAIRDataTeam/fdp-server/issues"  # placeholder

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fdpneo_server"]

# ----------------------------------------------------------------------------
# Ruff — lint and format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "S",    # flake8-bandit (security)
  "ASYNC",
  "PTH",  # use pathlib
  "TID",  # tidy imports
  "ARG",  # unused arguments
]
ignore = [
  "E501",   # line length — handled by formatter
  "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG"]
"src/fdpneo_server/cli.py" = ["B008"]  # typer uses function defaults heavily
"src/fdpneo_server/identity/deps.py" = ["B008"]  # FastAPI Depends() in argument defaults is the idiomatic pattern
"src/fdpneo_server/identity/jwks.py" = ["N818"]  # UnknownSigningKey reads cleanly; JWKSError is the base
"src/fdpneo_server/shared/errors.py" = ["N818"]  # HTTP-style names (NotFound, Forbidden, …) are intentional

[tool.ruff.lint.isort]
known-first-party = ["fdpneo_server"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ----------------------------------------------------------------------------
# Pyright — type checking
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "src/fdpneo_server/migrations/versions"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
# Unit tests legitimately reach into a module's internals (e.g. `mod._helper`),
# which is the intended way to test them. There is no cross-module private
# access in src today, so disabling this rule is test-ergonomics only, not a
# loosening of the production type contract.
reportPrivateUsage = false

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--showlocals",
]
markers = [
  "unit: fast tests with no I/O",
  "integration: tests that spin up containers (testcontainers)",
  "conformance: FDP spec or LDP test suite conformance",
  "slow: tests that take more than a few seconds",
]
asyncio_mode = "auto"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
  # rdflib's JSON-LD parser still constructs ConjunctiveGraph internally
  "ignore:ConjunctiveGraph is deprecated:DeprecationWarning",
  # starlette's TestClient emits this on import when httpx (not httpx2) is the
  # installed transport; we use httpx and the warning is harmless for tests.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["src/fdpneo_server"]
branch = true
omit = ["src/fdpneo_server/cli.py", "src/fdpneo_server/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]
show_missing = true
skip_covered = false
