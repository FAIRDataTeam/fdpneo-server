[alembic]
# Migration scripts ship inside the installed package (fdp/migrations), so
# `fdp db migrate` works from a wheel without a source checkout. The URL is
# resolved from fdpneo_server.config.Settings inside env.py rather than hard-coded here.
script_location = fdpneo_server:migrations
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Pipe newly generated migration files through ruff format so they don't
# trip the project's format check.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
